# PPO on the Phase 2 3D point-mass lunar descent (src/lander/envs/descent3d.py).
# First, untuned settings: LunarLander's PPO hyperparameters plus observation
# normalisation, which this env needs (positions in metres, velocities in m/s,
# propellant in kg).

env:
  name: descent3d
  kwargs: {}                  # any DescentConfig field can be overridden here

algo: PPO
seed: 0
total_timesteps: 3_000_000

n_envs: 16
vec_env: dummy
torch_threads: 1
normalize: true               # observation normalisation (see checkpoints.py)

eval:
  freq: 20_000
  n_episodes: 20              # EvalCallback also logs eval/success_rate (env reports is_success)
  n_envs: 5

ppo:
  n_steps: 1024
  batch_size: 64
  n_epochs: 4
  gamma: 0.999                # matches the env's shaping_gamma, which the shaping guarantee assumes
  gae_lambda: 0.98
  ent_coef: 0.01
  learning_rate: 3.0e-4
  policy_kwargs:
    net_arch: [64, 64]
