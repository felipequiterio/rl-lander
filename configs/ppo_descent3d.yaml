# PPO on the Phase 2 3D point-mass lunar descent (src/lander/envs/descent3d.py).
# LunarLander's PPO hyperparameters plus three changes that made it learn (see
# docs/phase2-plan.md, "Findings"): glide-slope penalty instead of termination in
# training, graded touchdown reward, and a start-condition curriculum. With these,
# 4/4 seeds reach 77-94% success on the full task, but the policies burn 540-590 kg
# of the 600 kg budget and drift into running dry late in training. Known issue.

env:
  name: descent3d
  kwargs:
    glide_slope_mode: penalty   # training aid; violations still never count as success
    touchdown_reward: graded    # partial credit for near misses
    failure_reward: -150.0      # out of propellant (or a violation) is worse than any crash

algo: PPO
seed: 0
total_timesteps: 3_000_000

n_envs: 16
vec_env: dummy
torch_threads: 1
normalize: true               # observation normalisation (see checkpoints.py)
curriculum:                   # start easy (low, close, slow), widen to the full start box
  method: set_difficulty
  start: 0.0
  end: 1.0
  ramp_fraction: 0.6

eval:
  freq: 20_000
  n_episodes: 20              # EvalCallback also logs eval/success_rate (env reports is_success)
  n_envs: 5

ppo:
  n_steps: 1024
  batch_size: 64
  n_epochs: 4
  gamma: 0.999                # matches the env's shaping_gamma, which the shaping guarantee assumes
  gae_lambda: 0.98
  ent_coef: 0.01
  learning_rate: 3.0e-4
  policy_kwargs:
    net_arch: [64, 64]
