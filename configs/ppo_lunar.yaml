# PPO on continuous LunarLander. Hyperparameters are the tuned set from
# rl-baselines3-zoo (hyperparams/ppo.yml, LunarLanderContinuous), which typically
# reaches mean eval reward >= 200 ("solved") within ~0.5-1M steps.

env:
  name: lunar_lander          # key in lander.envs.REGISTRY
  kwargs:
    continuous: true

algo: PPO
seed: 0                       # overridden by `lander-launch --seeds ...` / `lander-train --seed`
total_timesteps: 1_000_000

n_envs: 16                    # parallel envs collecting experience for each PPO update
# dummy = all envs stepped in this process; subproc = one process per env.
# LunarLander physics is so cheap that subproc's inter-process overhead costs more
# than it saves (measured: 28s vs 32s for 200k steps). subproc pays off once
# env.step() is expensive.
vec_env: dummy
torch_threads: 1              # the MLP is tiny; 1 thread avoids CPU oversubscription with parallel runs

eval:
  freq: 10_000                # total env steps (across all n_envs) between evaluations
  n_episodes: 10              # deterministic episodes per evaluation; "best" = their mean return
  n_envs: 5                   # eval episodes run in parallel batches of this size

ppo:
  # Each update collects n_steps * n_envs = 16,384 transitions, then does
  # n_epochs passes over them in minibatches of batch_size.
  n_steps: 1024
  batch_size: 64
  n_epochs: 4
  # gamma: discount factor. 0.999 = the agent cares about rewards ~1000 steps
  # ahead, i.e. the whole episode, so the +100 landing bonus at the end still
  # pulls on early decisions.
  gamma: 0.999
  gae_lambda: 0.98            # bias/variance trade-off of the advantage estimate
  ent_coef: 0.01              # small entropy bonus keeps exploring instead of committing early
  learning_rate: 3.0e-4
  policy_kwargs:
    net_arch: [64, 64]        # SB3 default MLP: two hidden layers of 64 for both actor and critic
